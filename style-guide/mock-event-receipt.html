<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>モック | 参加費の領収書</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../src/app/attendance.css">
  <link rel="stylesheet" href="deco.css">
  <link rel="stylesheet" href="mock.css">
  <link rel="stylesheet" href="mock-screens.css">
</head>
<body class="deco deco--tape deco--tape-shadow" data-scope="onboard" data-nav="participant" data-current="participant-history" data-screen="参加費の領収書" data-path="/events/[id]/receipt">
  <a class="skip-link" href="#main">本文へ</a>

  <main class="page" id="main">
    <div class="stack">

      <div>
        <p class="eyebrow">領収書</p>
        <h1 class="page-title">参加費の領収書</h1>
        <p class="page-lead">秋の芋煮会 ／ 11月8日（日）</p>
      </div>

      <div class="receipt-sheet">
        <p class="receipt-sheet__title">領収書</p>
        <p class="receipt-sheet__no">No. R-2026-1108-0042</p>

        <p class="receipt-sheet__to">山田 花子 様</p>

        <p class="receipt-sheet__amount">￥1,000</p>
        <p class="screen-note" style="text-align: right; margin-top: 0.125rem">（消費税込み）</p>

        <div class="receipt-sheet__lines">
          <div class="receipt-sheet__line">
            <span>但し書き</span>
            <span>秋の芋煮会 参加費として</span>
          </div>
          <div class="receipt-sheet__line">
            <span>内訳</span>
            <span>大人 2名 × 500円</span>
          </div>
          <div class="receipt-sheet__line">
            <span>受領日</span>
            <span>2026年11月8日</span>
          </div>
          <div class="receipt-sheet__line">
            <span>発行者</span>
            <span>佐藤 みのり</span>
          </div>
        </div>

        <p class="receipt-sheet__foot">
          この領収書は、主催者が発行したものです。再発行は、同じページから何度でも行えます。
          参加費の返金や、主催者との連絡は、主催者へ直接お問い合わせください。
        </p>
      </div>

      <div class="panel__actions">
        <button class="btn btn--primary" type="button">印刷する</button>
        <button class="btn btn--outline" type="button">PDFで保存</button>
        <a class="btn btn--ghost" href="mock-participant-history.html">参加履歴へ戻る</a>
      </div>

      <p class="screen-note">
        印刷では、この用紙だけを出します。ヘッダーとフッターは印刷されません。
      </p>

    </div>
  </main>

  <script src="mock-theme.js"></script>
  <script src="mock-shell.js"></script>
</body>
</html>
