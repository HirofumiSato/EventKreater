<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>モック | メールの確認</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../src/app/attendance.css">
  <link rel="stylesheet" href="deco.css">
  <link rel="stylesheet" href="mock.css">
  <link rel="stylesheet" href="mock-screens.css">
</head>
<body class="deco deco--tape deco--tape-shadow" data-scope="onboard" data-nav="public" data-screen="メールの確認" data-path="/auth/verify">
  <a class="skip-link" href="#main">本文へ</a>

  <main class="page page--form" id="main">
    <div class="stack">

      <div>
        <p class="eyebrow">確認</p>
        <h1 class="page-title">メールを確認しました</h1>
        <p class="page-lead">あと 1つで登録が終わります。電話番号を確認します。</p>
      </div>

      <div class="alert alert--success">
        アドレス <strong>minori@example.com</strong> の確認が取れました。
      </div>

      <div class="auth-card">
        <h2 class="auth-card__title">電話番号の確認</h2>
        <p class="auth-card__note">
          登録した番号に 6桁の番号を送ります。番号は、ログインのときにも使います。
        </p>

        <div class="auth-card__body">
          <div class="field">
            <label class="label" for="vf-phone">電話番号</label>
            <input class="input" id="vf-phone" type="tel" inputmode="tel" autocomplete="tel" value="090-1234-5678">
          </div>
          <div class="field">
            <label class="label" for="vf-code">6桁の番号</label>
            <input class="input code-input" id="vf-code" inputmode="numeric" maxlength="6" value="">
          </div>
        </div>

        <div class="panel__actions" style="margin-top: 0.875rem">
          <button class="btn btn--primary btn--block" type="button">確認して登録を終える</button>
          <button class="btn btn--ghost btn--block" type="button">番号を送り直す</button>
        </div>
      </div>

      <p class="screen-note">
        参加者の入口から登録した方は、確認のあと
        <a href="mock-participant-login.html">参加者ログイン</a>の電話番号確認へ進みます。
      </p>

    </div>
  </main>

  <script src="mock-theme.js"></script>
  <script src="mock-shell.js"></script>
</body>
</html>
