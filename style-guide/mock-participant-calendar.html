<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>モック | 参加カレンダー</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../src/app/attendance.css">
  <link rel="stylesheet" href="deco.css">
  <link rel="stylesheet" href="mock.css">
  <link rel="stylesheet" href="mock-screens.css">
</head>
<body class="deco deco--tape deco--tape-shadow" data-scope="onboard" data-nav="participant" data-current="participant-calendar" data-screen="参加カレンダー" data-path="/participant/calendar">
  <a class="skip-link" href="#main">本文へ</a>

  <main class="page" id="main">
    <div class="stack">

      <div>
        <p class="eyebrow">参加者</p>
        <h1 class="page-title">参加カレンダー</h1>
        <p class="page-lead">出欠を答えた催しが、開催日に並びます。</p>
      </div>

      <div class="cal">
        <div class="cal__head">
          <p class="cal__month">2026年 11月</p>
          <div class="cal__nav">
            <button type="button" aria-label="前の月">‹</button>
            <button type="button">今月</button>
            <button type="button" aria-label="次の月">›</button>
          </div>
        </div>

        <div class="cal__weekday" aria-hidden="true">
          <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
        </div>

        <div class="cal__grid">
          <button class="cal__day is-outside" type="button">1</button>
          <button class="cal__day is-outside" type="button">2</button>
          <button class="cal__day is-outside" type="button">3</button>
          <button class="cal__day is-outside" type="button">4</button>
          <button class="cal__day is-outside" type="button">5</button>
          <button class="cal__day is-outside" type="button">6</button>
          <button class="cal__day is-outside" type="button">7</button>

          <button class="cal__day has-event is-selected" type="button" aria-pressed="true">8</button>
          <button class="cal__day" type="button">9</button>
          <button class="cal__day" type="button">10</button>
          <button class="cal__day" type="button">11</button>
          <button class="cal__day" type="button">12</button>
          <button class="cal__day" type="button">13</button>
          <button class="cal__day" type="button">14</button>

          <button class="cal__day" type="button">15</button>
          <button class="cal__day" type="button">16</button>
          <button class="cal__day" type="button">17</button>
          <button class="cal__day" type="button">18</button>
          <button class="cal__day" type="button">19</button>
          <button class="cal__day" type="button">20</button>
          <button class="cal__day" type="button">21</button>

          <button class="cal__day has-event" type="button">22</button>
          <button class="cal__day" type="button">23</button>
          <button class="cal__day" type="button">24</button>
          <button class="cal__day has-event is-waitlist is-today" type="button">25</button>
          <button class="cal__day" type="button">26</button>
          <button class="cal__day" type="button">27</button>
          <button class="cal__day" type="button">28</button>

          <button class="cal__day" type="button">29</button>
          <button class="cal__day" type="button">30</button>
          <button class="cal__day is-outside" type="button">1</button>
          <button class="cal__day is-outside" type="button">2</button>
          <button class="cal__day is-outside" type="button">3</button>
          <button class="cal__day is-outside" type="button">4</button>
          <button class="cal__day is-outside" type="button">5</button>
        </div>

        <div class="cal__legend">
          <span><i aria-hidden="true"></i>出席</span>
          <span><i class="is-waitlist" aria-hidden="true"></i>参加要望</span>
          <span><i class="is-declined" aria-hidden="true"></i>欠席</span>
        </div>
      </div>

      <section class="section" style="margin-top: 0">
        <div class="section__head">
          <h2 class="section__title">11月8日（日）</h2>
          <p class="section__note">この日の催しは 1件です。</p>
        </div>

        <ul class="rows" style="margin-top: 0.75rem">
          <li class="rows__item">
            <div class="rows__main">
              <p class="rows__title">秋の芋煮会</p>
              <p class="rows__meta">11:00–15:00 ／ 河川敷公園 第2広場</p>
            </div>
            <span class="badge badge--attending badge--sm">出席</span>
          </li>
        </ul>

        <div class="panel__actions" style="margin-top: 1rem">
          <a class="btn btn--primary btn--sm" href="mock-event.html">出欠を変える</a>
          <a class="btn btn--outline btn--sm" href="mock-participant-history.html">履歴を見る</a>
        </div>
      </section>

      <p class="screen-note">
        主催者が開催日を複数にすると、そのすべての日に 1件ずつ並びます。外部カレンダーとの連携はしていません。
      </p>

    </div>
  </main>

  <script src="mock-theme.js"></script>
  <script src="mock-shell.js"></script>
</body>
</html>
