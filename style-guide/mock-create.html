<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>モック | 新規イベント作成</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../src/styles/index.css">
  <link rel="stylesheet" href="mock.css">
  <link rel="stylesheet" href="mock-states.css">
</head>
<body class="deco deco--tape deco--tape-shadow" data-scope="onboard" data-nav="organizer" data-current="create" data-screen="新規イベント作成" data-path="/organizer/events/new">
  <a class="skip-link" href="#main">本文へ</a>

  <main class="page" id="main">
    <div class="page--form stack">

      <div>
        <p class="eyebrow">5ステップ</p>
        <h1 class="page-title">新規イベント作成</h1>
        <p class="page-lead">
          済んだステップは畳まれます。次に入れるものだけが開きます。
        </p>
      </div>

      <div class="progress-card">
        <div class="progress-card__head">
          <span class="progress-card__label">必須の入力</span>
          <span class="progress-card__count"><strong id="progress-done">0</strong> / 3 <span>（全 5 ステップ）</span></span>
        </div>
        <div class="progress-card__track">
          <span class="progress-card__fill" id="progress-fill" style="width: 0%"></span>
        </div>
        <div class="progress-dots" id="progress-dots" aria-hidden="true">
          <span class="progress-dots__dot is-current"></span>
          <span class="progress-dots__dot"></span>
          <span class="progress-dots__dot"></span>
          <span class="progress-dots__dot"></span>
          <span class="progress-dots__dot"></span>
        </div>
      </div>

      <p class="alert alert--success">無料トライアル残り 2回</p>

      <form class="form event-steps" novalidate>
        <ol class="event-steps__list">

          <li class="event-step event-step--open" data-step="basic"
              data-hint="何をいつ開くか。チラシにも告知ページにも出ます。"
              data-summary="秋の芋煮会 / 11月8日（日）11:00-15:00">
            <h2 class="event-step__heading">
              <button type="button" class="event-step__toggle" aria-expanded="true">
                <span class="event-step__number" aria-hidden="true">1</span>
                <span class="event-step__labels">
                  <span class="event-step__title">催しの名前と開催日時 <span class="req">*</span></span>
                  <span class="event-step__summary">何をいつ開くか。チラシにも告知ページにも出ます。</span>
                </span>
                <span class="event-step__state">未入力</span>
              </button>
            </h2>
            <div class="event-step__body">
              <div class="field">
                <label class="label" for="mc-title">催しの名前</label>
                <input class="input" id="mc-title" value="秋の芋煮会">
              </div>
              <div class="repeat-block">
                <div class="repeat-row repeat-row--schedule">
                  <div class="field">
                    <label class="label" for="mc-date">開催日</label>
                    <input class="input" id="mc-date" type="date" value="2026-11-08">
                  </div>
                  <div class="field">
                    <label class="label" for="mc-start">開始</label>
                    <input class="input" id="mc-start" type="time" value="11:00">
                  </div>
                  <div class="field">
                    <label class="label" for="mc-end">終了</label>
                    <input class="input" id="mc-end" type="time" value="15:00">
                  </div>
                  <button type="button" class="btn btn--ghost btn--sm" disabled>削除</button>
                </div>
              </div>
              <div class="event-step__actions">
                <button type="button" class="btn btn--primary event-step__next" data-next="basic">次へ</button>
              </div>
            </div>
          </li>

          <li class="event-step" data-step="pricing"
              data-hint="参加者が選ぶ金額です。あとから追加できます。"
              data-summary="大人 500円 / 子ども 無料">
            <h2 class="event-step__heading">
              <button type="button" class="event-step__toggle" aria-expanded="false">
                <span class="event-step__number" aria-hidden="true">2</span>
                <span class="event-step__labels">
                  <span class="event-step__title">費用プラン <span class="req">*</span></span>
                  <span class="event-step__summary">参加者が選ぶ金額です。あとから追加できます。</span>
                </span>
                <span class="event-step__state">未入力</span>
              </button>
            </h2>
            <div class="event-step__body">
              <div class="repeat-block">
                <div class="repeat-row repeat-row--plan">
                  <div class="field">
                    <label class="label" for="mc-plan-name">プラン名</label>
                    <input class="input" id="mc-plan-name" value="大人">
                  </div>
                  <div class="field">
                    <label class="label" for="mc-plan-amount">金額</label>
                    <input class="input" id="mc-plan-amount" inputmode="numeric" value="500">
                  </div>
                  <div class="field">
                    <label class="label" for="mc-plan-note">補足</label>
                    <input class="input" id="mc-plan-note" value="当日集金">
                  </div>
                </div>
              </div>
              <div class="event-step__actions">
                <button type="button" class="btn btn--ghost" data-back="pricing">戻る</button>
                <button type="button" class="btn btn--primary event-step__next" data-next="pricing">次へ</button>
              </div>
            </div>
          </li>

          <li class="event-step" data-step="location"
              data-hint="会場名だけでも保存できます。雨天時の方針もここで決めます。"
              data-summary="河川敷公園 第2広場 / 雨天決行">
            <h2 class="event-step__heading">
              <button type="button" class="event-step__toggle" aria-expanded="false">
                <span class="event-step__number" aria-hidden="true">3</span>
                <span class="event-step__labels">
                  <span class="event-step__title">開催場所 <span class="req">*</span></span>
                  <span class="event-step__summary">会場名だけでも保存できます。雨天時の方針もここで決めます。</span>
                </span>
                <span class="event-step__state">未入力</span>
              </button>
            </h2>
            <div class="event-step__body">
              <div class="field">
                <label class="label" for="mc-venue">会場名</label>
                <input class="input" id="mc-venue" value="河川敷公園 第2広場">
              </div>
              <div class="field">
                <label class="label" for="mc-rain">雨天時の方針</label>
                <select class="select" id="mc-rain">
                  <option selected>雨天決行</option>
                  <option>中止</option>
                  <option>順延</option>
                </select>
              </div>
              <div class="event-step__actions">
                <button type="button" class="btn btn--ghost" data-back="location">戻る</button>
                <button type="button" class="btn btn--primary event-step__next" data-next="location">次へ</button>
              </div>
            </div>
          </li>

          <li class="event-step" data-step="capacity"
              data-hint="どちらも任意です。空欄なら制限なしで受け付けます。"
              data-summary="定員 40名 / 期限 11月5日 23:59">
            <h2 class="event-step__heading">
              <button type="button" class="event-step__toggle" aria-expanded="false">
                <span class="event-step__number" aria-hidden="true">4</span>
                <span class="event-step__labels">
                  <span class="event-step__title">定員と申し込み期限</span>
                  <span class="event-step__summary">どちらも任意です。空欄なら制限なしで受け付けます。</span>
                </span>
                <span class="event-step__state">任意</span>
              </button>
            </h2>
            <div class="event-step__body">
              <div class="field">
                <label class="label" for="mc-capacity">定員</label>
                <input class="input" id="mc-capacity" inputmode="numeric" value="40" placeholder="空欄なら制限なし">
              </div>
              <div class="field">
                <label class="label" for="mc-deadline">申し込み期限</label>
                <input class="input" id="mc-deadline" type="datetime-local" value="2026-11-05T23:59">
              </div>
              <div class="event-step__actions">
                <button type="button" class="btn btn--ghost" data-back="capacity">戻る</button>
                <button type="button" class="btn btn--primary event-step__next" data-next="capacity">次へ</button>
              </div>
            </div>
          </li>

          <li class="event-step" data-step="flyer"
              data-hint="作らなくても公開できます。あとから作り直せます。"
              data-summary="チラシなし">
            <h2 class="event-step__heading">
              <button type="button" class="event-step__toggle" aria-expanded="false">
                <span class="event-step__number" aria-hidden="true">5</span>
                <span class="event-step__labels">
                  <span class="event-step__title">チラシ生成</span>
                  <span class="event-step__summary">作らなくても公開できます。あとから作り直せます。</span>
                </span>
                <span class="event-step__state">任意</span>
              </button>
            </h2>
            <div class="event-step__body">
              <p class="help">入力した内容から、縦長のチラシを生成します。告知ページの先頭に載ります。</p>
              <div class="event-step__actions">
                <button type="button" class="btn btn--ghost" data-back="flyer">戻る</button>
                <button type="button" class="btn btn--outline" data-save>下書き保存</button>
                <button type="button" class="btn btn--primary" data-preview>プレビューを見る</button>
              </div>
            </div>
          </li>

        </ol>
      </form>

    </div>
  </main>

  <!-- 音声入力。本体の VoiceInputDock と同じ markup と CSS（src/styles/）を使う。
       ここでは見た目と、押したときの流れだけを再現する。 -->
  <div class="voice-scrim" id="voice-scrim" aria-hidden="true" hidden></div>

  <button
    type="button"
    class="voice-fab"
    id="voice-fab"
    aria-label="音声入力を開始"
    aria-pressed="false"
  >
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
      <path d="M12 19v3"></path>
    </svg>
    <span class="voice-fab__label">音声入力</span>
  </button>

  <section class="voice-panel" id="voice-panel" aria-label="音声入力" hidden>
    <div class="voice-panel__head">
      <p class="voice-panel__title" id="voice-title">音声入力</p>
      <button type="button" class="voice-panel__close" id="voice-close">終了</button>
    </div>
    <p class="voice-panel__field" id="voice-field">催しの名前</p>
    <p class="voice-panel__prompt" id="voice-prompt" aria-live="polite">
      催しの名前を話してください。
    </p>
    <p class="voice-panel__hint" id="voice-hint">例: 忘年会</p>
    <p class="voice-panel__transcript" id="voice-transcript" hidden></p>
    <p class="voice-panel__message" id="voice-message" role="status" hidden></p>
    <div class="voice-panel__actions">
      <button type="button" class="btn btn--primary btn--sm" id="voice-talk">話す</button>
      <button type="button" class="btn btn--ghost btn--sm" id="voice-prev">戻る</button>
      <button type="button" class="btn btn--ghost btn--sm" id="voice-skip">スキップ</button>
    </div>
    <label class="check voice-panel__optional">
      <input type="checkbox" id="voice-optional" />
      任意の項目も聞く
    </label>
    <p class="voice-panel__note">
      いま聞いている欄は、そのまま手で直せます。ほかの欄を直すときは、いったん終了してください。
    </p>
  </section>

  <script src="mock-theme.js"></script>
  <script src="mock-shell.js"></script>
  <script>
    const STEPS = ["basic", "pricing", "location", "capacity", "flyer"];
    const MANDATORY = ["basic", "pricing", "location"];
    const TITLES = {
      basic: "催しの名前と開催日時",
      pricing: "費用プラン",
      location: "開催場所",
      capacity: "定員と申し込み期限",
      flyer: "チラシ生成",
    };

    let openKey = "basic";
    let done = new Set();

    // 途中の状態で開く。比較用に ?step=2..5 を受ける。製品には要らない。
    const stepParam = Number(new URLSearchParams(location.search).get("step"));
    if (stepParam >= 2 && stepParam <= STEPS.length) {
      for (const key of STEPS.slice(0, stepParam - 1)) done.add(key);
      openKey = STEPS[stepParam - 1];
    }

    const items = new Map();
    for (const li of document.querySelectorAll(".event-step")) {
      items.set(li.dataset.step, li);
    }

    // 通知。製品は Toast.tsx が同じ markup を出す。
    let toastTimer = null;
    function showToast(message) {
      const old = document.querySelector(".mock-toast");
      if (old) old.remove();
      const host = document.createElement("div");
      host.className = "toast mock-toast";
      host.innerHTML =
        '<div class="alert alert--success"><div class="summary" style="border:0;padding:0"><p></p>' +
        '<button type="button" class="btn btn--ghost btn--sm">閉じる</button></div></div>';
      host.querySelector("p").textContent = message;
      host.querySelector("button").addEventListener("click", () => host.remove());
      document.body.append(host);
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => host.remove(), 5000);
    }

    function render() {
      for (const [key, li] of items) {
        const open = key === openKey;
        const isDone = done.has(key);
        li.classList.toggle("event-step--open", open);
        li.classList.toggle("event-step--done", isDone);
        li.querySelector(".event-step__toggle").setAttribute("aria-expanded", String(open));
        li.querySelector(".event-step__summary").textContent = open
          ? li.dataset.hint
          : (isDone ? li.dataset.summary : li.dataset.hint);
        const state = li.querySelector(".event-step__state");
        if (MANDATORY.includes(key)) {
          state.textContent = isDone ? "入力済み" : "未入力";
        } else {
          state.textContent = isDone ? "入力済み" : "任意";
        }
      }

      const count = MANDATORY.filter((key) => done.has(key)).length;
      document.getElementById("progress-done").textContent = String(count);
      document.getElementById("progress-fill").style.width = `${(count / MANDATORY.length) * 100}%`;

      const dots = document.querySelectorAll(".progress-dots__dot");
      dots.forEach((dot, index) => {
        const key = STEPS[index];
        dot.classList.toggle("is-done", done.has(key));
        dot.classList.toggle("is-current", key === openKey && !done.has(key));
      });

      for (const [key, li] of items) {
        if (li.dataset.justDone !== "true") continue;
        delete li.dataset.justDone;
        li.classList.add("event-step--just-done");
        setTimeout(() => li.classList.remove("event-step--just-done"), 300);
      }
    }

    function goNext(key) {
      done.add(key);
      items.get(key).dataset.justDone = "true";
      const index = STEPS.indexOf(key);
      const next = STEPS[index + 1];
      openKey = next ?? key;
      render();
      if (next) {
        showToast(`「${TITLES[key]}」を入力しました。次は「${TITLES[next]}」です。`);
      }
    }

    function goBack(key) {
      const index = STEPS.indexOf(key);
      openKey = STEPS[index - 1] ?? key;
      render();
    }

    for (const li of items.values()) {
      li.querySelector(".event-step__toggle").addEventListener("click", () => {
        openKey = openKey === li.dataset.step ? "" : li.dataset.step;
        render();
      });
      const nextButton = li.querySelector("[data-next]");
      if (nextButton) nextButton.addEventListener("click", () => goNext(nextButton.dataset.next));
      const backButton = li.querySelector("[data-back]");
      if (backButton) backButton.addEventListener("click", () => goBack(backButton.dataset.back));
    }

    document.querySelector("[data-save]").addEventListener("click", () =>
      showToast("下書きを保存しました。プレビューで見た目を確認できます。"),
    );
    document.querySelector("[data-preview]").addEventListener("click", () =>
      showToast("公開の準備ができました。プレビューを開きます。"),
    );

    render();

    // -------------------------------------------------------------------
    // 音声入力。本体の VoiceInputDock の流れを見た目だけでなぞる。
    // 上から順に欄を指し、話したことにする。値は変えない。
    // -------------------------------------------------------------------
    const VOICE_STEPS = {
      basic: [
        ["mc-title", "催しの名前", "催しの名前を話してください。", "忘年会"],
        ["mc-date", "開催日", "開催日を話してください。", "12月5日"],
        ["mc-start", "開始時刻", "開始時刻を話してください。", "18時"],
        ["mc-end", "終了時刻", "終了時刻を話してください。", "20時"],
      ],
      pricing: [
        ["mc-plan-name", "費用プランの名前", "費用プランの名前を話してください。", "一般"],
        ["mc-plan-amount", "金額", "金額を円で話してください。", "3000円"],
        ["mc-plan-note", "費用の補足", "費用の補足があれば話してください。無ければ「スキップ」を押します。", "1ドリンク付"],
      ],
      location: [
        ["mc-venue", "会場名", "会場名を話してください。", "渋谷ホール"],
        ["mc-rain", "雨天時の方針", "雨天のときの方を話してください。", "雨天決行"],
      ],
      capacity: [
        ["mc-capacity", "定員", "定員を話してください。「無制限」でも構いません。", "30人"],
        ["mc-deadline", "申し込み期限", "申し込みの期限を話してください。「なし」でも構いません。", "12月1日23時59分"],
      ],
      flyer: [],
    };

    const voiceFab = document.getElementById("voice-fab");
    const voicePanel = document.getElementById("voice-panel");
    const voiceScrim = document.getElementById("voice-scrim");
    const voiceTitle = document.getElementById("voice-title");
    const voiceField = document.getElementById("voice-field");
    const voicePrompt = document.getElementById("voice-prompt");
    const voiceHint = document.getElementById("voice-hint");
    const voiceTranscript = document.getElementById("voice-transcript");
    const voiceMessage = document.getElementById("voice-message");
    const voiceTalk = document.getElementById("voice-talk");
    const voiceOptional = document.getElementById("voice-optional");

    let voiceOn = false;
    let voiceListening = false;
    let voiceCursor = 0;
    let voiceTarget = null;

    const voiceList = () => VOICE_STEPS[openKey] ?? [];
    const voiceEntry = () => voiceList()[voiceCursor] ?? null;

    // いま聞いている欄のまわりだけを覆いからくり抜く。clip-path は当たり判定にも効く。
    function measureVoiceSpotlight() {
      if (!voiceOn || !voiceTarget) return;
      const rect = voiceTarget.getBoundingClientRect();
      const pad = 6;
      const top = Math.max(0, rect.top - pad);
      const left = Math.max(0, rect.left - pad);
      const right = rect.right + pad;
      const bottom = rect.bottom + pad;
      voiceScrim.style.clipPath =
        "polygon(0 0, 100% 0, 100% 100%, 0 100%, 0 0, " +
        `${left}px ${top}px, ${left}px ${bottom}px, ${right}px ${bottom}px, ` +
        `${right}px ${top}px, ${left}px ${top}px)`;
    }

    function showVoiceMessage(text) {
      voiceMessage.textContent = text;
      voiceMessage.hidden = !text;
    }

    function pointVoiceAt(index) {
      voiceTarget?.removeAttribute("data-voice-target");
      voiceTarget = null;
      voiceListening = false;
      voiceTitle.textContent = "音声入力";

      const list = voiceList();
      if (!list.length) {
        voiceField.textContent = "入力できる欄がすべて埋まりました";
        voicePrompt.textContent = "内容を確認してください。";
        voiceHint.hidden = true;
        voiceTalk.disabled = true;
        voiceTalk.textContent = "話す";
        measureVoiceSpotlight();
        return;
      }

      voiceCursor = Math.max(0, Math.min(index, list.length - 1));
      const [id, label, prompt, example] = list[voiceCursor];
      const target = document.getElementById(id);
      voiceTarget = target;
      target?.setAttribute("data-voice-target", "true");

      const current = target?.value?.trim();
      voiceField.textContent = label;
      voicePrompt.textContent = prompt;
      voiceHint.hidden = false;
      voiceHint.textContent = `例: ${example}${current ? ` ／ いまの値: ${current}` : ""}`;
      voiceTalk.disabled = false;
      voiceTalk.textContent = current ? "言い直す" : "話す";
      showVoiceMessage("");
      voiceTranscript.hidden = true;

      target?.scrollIntoView({ block: "center", behavior: "smooth" });
      measureVoiceSpotlight();
    }

    function setVoice(on) {
      voiceOn = on;
      voiceFab.classList.toggle("voice-fab--active", on);
      voiceFab.setAttribute("aria-pressed", String(on));
      voiceFab.setAttribute("aria-label", on ? "音声入力を終了" : "音声入力を開始");
      voiceFab.querySelector(".voice-fab__label").textContent = on ? "終了" : "音声入力";
      voicePanel.hidden = !on;
      voiceScrim.hidden = !on;

      if (!on) {
        voiceTarget?.removeAttribute("data-voice-target");
        voiceTarget = null;
        voiceListening = false;
        return;
      }

      // 閉じているステップなら、最初の未入力のステップを開く。
      if (!openKey || !items.get(openKey)?.classList.contains("event-step--open")) {
        openKey = STEPS.find((key) => !done.has(key)) ?? "basic";
        render();
      }
      pointVoiceAt(0);
    }

    voiceFab.addEventListener("click", () => setVoice(!voiceOn));
    document.getElementById("voice-close").addEventListener("click", () => setVoice(false));
    document.getElementById("voice-prev").addEventListener("click", () => pointVoiceAt(voiceCursor - 1));
    document.getElementById("voice-skip").addEventListener("click", () => pointVoiceAt(voiceCursor + 1));

    voiceOptional.addEventListener("change", () => {
      if (!voiceOn) return;
      showVoiceMessage(voiceOptional.checked ? "任意の項目も、続けて聞きます。" : "必須の項目だけを聞きます。");
    });

    voiceTalk.addEventListener("click", () => {
      const entry = voiceEntry();
      if (!entry) return;
      if (!voiceListening) {
        voiceListening = true;
        voiceTitle.textContent = "聞いています";
        voicePrompt.textContent = "話し終えたら「停止して入力」を押してください。";
        voiceTalk.textContent = "停止して入力";
        showVoiceMessage("");
        return;
      }

      // 聞き取りの結果。本体では、ここで欄に値が入る。
      const [, label, , example] = entry;
      const next = voiceList()[voiceCursor + 1];
      voiceListening = false;
      voiceTitle.textContent = "音声入力";
      if (next) pointVoiceAt(voiceCursor + 1);
      else voiceTalk.textContent = "言い直す";
      voiceTranscript.hidden = false;
      voiceTranscript.textContent = `聞き取り: ${example}`;
      showVoiceMessage(
        next
          ? `${label}を「${example}」で入力しました。次は${next[1]}です。`
          : `${label}を「${example}」で入力しました。音声で入力できる欄がすべて埋まりました。`,
      );
    });

    voiceScrim.addEventListener("click", () =>
      showVoiceMessage(
        "音声モード中は、いま聞いている欄のまわりだけ操作できます。「終了」か Esc で元に戻ります。",
      ),
    );

    document.addEventListener("keydown", (event) => {
      if (!voiceOn || event.key !== "Escape") return;
      event.stopPropagation();
      setVoice(false);
    });

    let voiceFrame = 0;
    const scheduleVoiceMeasure = () => {
      if (!voiceOn || voiceFrame) return;
      voiceFrame = requestAnimationFrame(() => {
        voiceFrame = 0;
        measureVoiceSpotlight();
      });
    };
    window.addEventListener("scroll", scheduleVoiceMeasure, { capture: true, passive: true });
    window.addEventListener("resize", scheduleVoiceMeasure);
  </script>
</body>
</html>
