<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>モック | 参加者ログイン</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../src/styles/index.css">
  <link rel="stylesheet" href="mock.css">
  <link rel="stylesheet" href="mock-states.css">
</head>
<body class="deco deco--tape deco--tape-shadow" data-scope="onboard" data-nav="public" data-current="participant-login" data-screen="参加者ログイン" data-path="/participant/login">
  <a class="skip-link" href="#main">本文へ</a>

  <main class="page page--form" id="main">
    <div class="stack">

      <div>
        <p class="eyebrow">参加者</p>
        <h1 class="page-title">参加者ログイン</h1>
        <p class="page-lead">出欠の記録と、参加した催しの履歴を残せます。登録しなくても、出欠は答えられます。</p>
      </div>

      <div class="auth-card">
        <h2 class="auth-card__title">電話番号で入る</h2>
        <p class="auth-card__note">パスワードは要りません。届いた 6桁の番号を入れるだけです。</p>

        <div class="auth-card__body">
          <div class="field">
            <label class="label" for="pl-phone">電話番号</label>
            <input class="input" id="pl-phone" type="tel" inputmode="tel" autocomplete="tel" value="090-1234-5678">
          </div>
        </div>

        <div class="panel__actions" style="margin-top: 0.875rem">
          <button class="btn btn--primary btn--block" type="button">番号を送る</button>
        </div>

        <div class="auth-alt">
          登録すると、これまでの出欠がまとめて残ります。主催者として催しを開く場合は
          <a href="mock-register.html">主催者のログイン</a>へ。
        </div>
      </div>

      <div class="auth-card">
        <h2 class="auth-card__title">確認番号を入れる</h2>
        <p class="auth-card__note">090-1234-5678 に送りました。5分で期限が切れます。</p>
        <div class="auth-card__body">
          <div class="field">
            <label class="label" for="pl-code">6桁の番号</label>
            <input class="input code-input" id="pl-code" inputmode="numeric" maxlength="6" value="418902">
          </div>
        </div>
        <div class="panel__actions" style="margin-top: 0.875rem">
          <button class="btn btn--primary btn--block" type="button">確認して入る</button>
          <button class="btn btn--ghost btn--block" type="button">番号を送り直す</button>
        </div>
      </div>

      <p class="screen-note">
        主催者から届いた告知URLを開いた方は、ログインしなくても出欠を答えられます。
      </p>

    </div>
  </main>

  <script src="mock-theme.js"></script>
  <script src="mock-shell.js"></script>
</body>
</html>
