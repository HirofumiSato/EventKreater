<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>モック | 共同幹事の招待</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../src/styles/index.css">
  <link rel="stylesheet" href="mock.css">
  <link rel="stylesheet" href="mock-states.css">
</head>
<body class="deco deco--tape deco--tape-shadow" data-scope="onboard" data-nav="organizer" data-current="organizer" data-screen="共同幹事の招待" data-path="/invitations/[code]">
  <a class="skip-link" href="#main">本文へ</a>

  <main class="page page--form" id="main">
    <div class="stack">

      <div>
        <p class="eyebrow">招待</p>
        <h1 class="page-title">共同幹事に加わりますか</h1>
        <p class="page-lead">秋の芋煮会 ／ 11月8日（日）11:00–15:00</p>
      </div>

      <div class="auth-card">
        <h2 class="auth-card__title">佐藤 みのり さんからの招待</h2>
        <p class="auth-card__note">
          加わると、この催しの出欠・名簿・売上を見られます。招待は 7日間有効です。
        </p>

        <dl class="kv" style="margin-top: 0.875rem">
          <div class="kv__row">
            <dt>できること</dt>
            <dd>出欠の確認、名簿の編集、当日の受付、売上の確認</dd>
          </div>
          <div class="kv__row">
            <dt>できないこと</dt>
            <dd>公開・非公開の切り替え、招待の再発行（筆頭幹事のみ）</dd>
          </div>
          <div class="kv__row">
            <dt>費用</dt>
            <dd>かかりません。公開回数は筆頭幹事の枠から引きます。</dd>
          </div>
        </dl>

        <div class="panel__actions" style="margin-top: 1rem">
          <button class="btn btn--primary btn--block" type="button">共同幹事として加わる</button>
          <a class="btn btn--ghost btn--block" href="mock-organizer.html">断る</a>
        </div>
      </div>

      <p class="screen-note">加わると、主催一覧にこの催しが並びます。あとから自分で抜けることもできます。</p>

    </div>
  </main>

  <script src="mock-theme.js"></script>
  <script src="mock-shell.js"></script>
</body>
</html>
