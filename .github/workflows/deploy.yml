# staging と production へのデプロイの入口。
#
# 中身（migrate → flyer → web の 3 ジョブ）は deploy-env.yml が持つ。この
# ワークフローは「どちらの環境へ、どの commit を、どの順で出すか」だけを決める。
#
# きっかけは 2 つ。
# - workflow_run: main の CI が緑で終わったとき。staging → production の順に流す。
# - workflow_dispatch: 手で流すとき。environment 入力を選ぶ（既定は staging）。
#   staging を選べば staging だけ、production を選べば production だけを流す。
#
# 順序は needs で決める。staging が赤なら production は走らない（staging が
# 本番のカナリアになる）。GitHub Environment `production` の承認（Required
# reviewers）は外してあるので、CI と staging が緑なら人手を挟まず production
# まで流れる。承認を戻すときは Settings → Environments で付ける（このファイル
# は変えなくてよい）。
#
# 自動デプロイは、リポジトリ変数 `DEPLOY_ENABLED` が `true` のときだけ動く。
# これは「まだ Fly のアプリも environment secrets も無い」段階で main にこの
# ファイルが入り、CI 成功のたびに赤い実行が積まれるのを避けるため。鍵を入れて
# 初回のデプロイを流せる状態にしてから `true` にする（手順は docs/deploy.rst の 2.4）。
# 変数が未設定のとき、ジョブは skipped で終わり、main は緑のままになる。
#
# 公開経路は Cloudflare Tunnel。web は [http_service] を持たず、Tunnel アプリ
# event-creater-tunnel が 6PN で event-creater-web.internal:3012 へ届ける。
# Tunnel アプリはコードを含まないので、このワークフローではデプロイしない
# （手作業で 1 回だけ作る）。web はチラシ画像・アイコンをローカルディスクに
# 置いており R2 が未実装なので、1 台固定の前提でデプロイする。
name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "デプロイ先（production は本番へ直接出る）"
        type: choice
        options: [staging, production]
        default: staging

# デプロイはリポジトリへ書かない。flyctl 用の鍵は environment secrets から読む。
permissions:
  contents: read

# 環境ごとに 1 本だけ流す。デプロイは途中で打ち切らない（cancel-in-progress: false）。
# 同じ環境の実行が重なったら、前の 1 本が終わってから次を始める。
#
# 環境ごとに分けるのは、staging を production の実行に巻き込まないため。
# 1 本の group にまとめると、本番のデプロイが終わるまで次のマージの staging が
# 始まらず、確認したい変更ほど後ろに詰まる。ここは呼ぶ側のジョブに置く。
# 呼ばれる側（deploy-env.yml）には置かない（同じ group を二重に持たない）。
jobs:
  staging:
    # CI が赤のまま本番へ出さない。workflow_dispatch は人の判断で流す。
    # DEPLOY_ENABLED は「アプリと秘密が揃っているか」の門番で、未設定なら skipped。
    # CI が手で流されたときは出さない（`event == 'push'`）。ci.yml の workflow_dispatch で
    # CI を流し直しただけで本番が動くと、何を見て出したのか分からなくなる。デプロイを
    # やり直したいときはこのファイルの workflow_dispatch を使う。
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging'))
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: staging
      # CI が見た commit そのものを出す。workflow_run の既定の checkout は
      # main の先頭を見るため、CI のあとに main が進むと別の commit を出してしまう。
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
    secrets: inherit

  production:
    needs: [staging]
    # needs が失敗したときの既定は skip なので、!cancelled() で外してから
    # 結果を明示的に見る。staging が失敗したら production は走らせない。
    # 手で production を選んだときは staging が skipped なので、それも通す。
    if: >-
      !cancelled() &&
      vars.DEPLOY_ENABLED == 'true' &&
      (needs.staging.result == 'success' || needs.staging.result == 'skipped') &&
      ((github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production'))
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: production
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
    secrets: inherit
