name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # 変更ファイルの判定が PR の一覧を GitHub API から読む。
  pull-requests: read

# ランナーは `-latest` にせず版を固定する。2026-10-19 から `ubuntu-latest` が
# Ubuntu 26.04 へ数週間かけて移行しており、切り替わる日によって OS・apt・
# プリインストールが変わる。チラシのフォントを apt で入れ、PostgreSQL を
# サービスで立てているので、同じ PR が日によって別の結果になるのを避ける。
# 版を上げるときは 1 本の PR で 4 ジョブまとめて変え、`ci.rst` も直す。
# 参照: https://github.com/actions/runner-images/issues/14748

jobs:
  # 手元の `npm run check:full` と同じ。lint、tsc --noEmit、DB を使わない Vitest、
  # モックの同期漏れの検査。
  # 手元の既定 `npm run check` は Vitest を省いた速い方なので、CI ではこちらを呼ぶ。
  # tests/setup/db.ts は TEST_DATABASE_URL が無ければ何も差し替えないため、
  # DATABASE_URL はダミーで足りる。PostgreSQL も Stripe も呼ばない。
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # 変更ファイルから、このジョブで走らせる範囲を決める。
      # 規則は scripts/ci-scope.mjs、仕様は tests/unit/ci-scope.test.mjs。
      # 独立した changes ジョブにすると、その 10 秒あまりを全ジョブが直列で待つ。
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/ci-scope.mjs

      # npm ci は 20 秒前後かかる。鍵を lock と schema.prisma に結び、
      # 一致するときは展開済みの node_modules を戻す（db ジョブと同じ鍵）。
      - name: node_modules を戻す
        id: node-cache
        if: steps.scope.outputs.code != 'false'
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'prisma/schema.prisma') }}

      # postinstall が prisma generate を呼ぶ。
      - name: 依存を入れる
        if: steps.scope.outputs.code != 'false' && steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci

      # キャッシュから戻したときは postinstall が走らないので、生成物だけ作り直す。
      - name: Prisma Client を生成する
        if: steps.scope.outputs.code != 'false' && steps.node-cache.outputs.cache-hit == 'true'
        run: npx prisma generate

      - if: steps.scope.outputs.code != 'false'
        run: npm run check:full
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci_placeholder
          JWT_SECRET: ci-only-placeholder-secret-value-not-used
          NEXT_PUBLIC_APP_URL: http://localhost:3012

  # 文書の整合。生成物に差分が出ないこと、原稿のパスが実在すること、
  # Sphinx が HTML を生成できることを見る。原稿だけ直して索引を忘れた PR を止める。
  #
  # 生成物はコードの実在にも依存する（traceability.md）ので、ここは絞らない。
  # 依存は入れない。生成スクリプトは node:fs / node:path しか import しないため、
  # npm ci（20 秒）を省ける。
  docs:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm run docs:gen

      - name: 生成物が最新か
        run: git diff --exit-code -- docs/doc-index.json docs/api-routes.md docs/traceability.md llms.txt

      - run: npm run docs:links

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      # .venv-docs を丸ごと戻す。pip install が 10 秒前後かかるため。
      # 復元した venv は作成時の Python を指すので、壊れていたら捨てて作り直す。
      - name: Python 環境を戻す
        id: venv
        uses: actions/cache@v6
        with:
          path: .venv-docs
          key: ${{ runner.os }}-docs-venv-${{ hashFiles('docs/requirements.txt') }}

      - name: 壊れた venv を捨てる
        if: steps.venv.outputs.cache-hit == 'true'
        run: .venv-docs/bin/python -c "import sphinx" || rm -rf .venv-docs

      - run: npm run docs:install

      - run: npm run docs

  # 結合テスト。テスト専用の PostgreSQL をサービスとして立て、本物の DB で確かめる。
  # スキーマは `prisma db push` ではなく `migrate deploy` で作る。db push は
  # 部分ユニーク索引（event_organizers_one_owner など）や CHECK 制約を作らないため、
  # それらを見ている結合テストが落ちる。
  db:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    services:
      postgres:
        # alpine 版はイメージが小さく、取得（コンテナ初期化）が数秒短い。
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: event_platform_billing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/ci-scope.mjs

      - name: node_modules を戻す
        id: node-cache
        if: steps.scope.outputs.code != 'false'
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'prisma/schema.prisma') }}

      - name: 依存を入れる
        if: steps.scope.outputs.code != 'false' && steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Prisma Client を生成する
        if: steps.scope.outputs.code != 'false' && steps.node-cache.outputs.cache-hit == 'true'
        run: npx prisma generate

      - if: steps.scope.outputs.code != 'false'
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/event_platform_billing_test

      - if: steps.scope.outputs.code != 'false'
        run: npm run test:db
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/event_platform_billing_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/event_platform_billing_test
          JWT_SECRET: ci-only-placeholder-secret-value-not-used
          NEXT_PUBLIC_APP_URL: http://localhost:3012

  # チラシ生成 API の pytest と mypy。描画に日本語フォントを使うので、apt で入れる。
  # フォントが無いと FontResolver が FontRenderError を投げて落ちる。
  #
  # mypy を別ジョブにせず、ここで続けて呼ぶ。理由は 2 つある。
  # - 依存（requirements.txt）の導入が 1 回で済む。2 ジョブに分けると 14 秒を二度払う。
  # - flyer はブランチ保護の必須チェックなので、mypy の失敗もマージを止められる。
  #   別ジョブのままだと、必須に登録しない限り型エラーが通ってしまう。
  # どちらが落ちたかは step 名（pytest / mypy）で分かる。
  flyer:
    runs-on: ubuntu-26.04
    # apt のミラーが遅い日に「日本語フォントを入れる」で止まり続けるのを、
    # 6 時間ではなく 10 分で失敗として返す。
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/flyer
    steps:
      - uses: actions/checkout@v7

      # 判定だけは Node で動かす。既定の working-directory を打ち消す。
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - id: scope
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/ci-scope.mjs

      - uses: actions/setup-python@v7
        if: steps.scope.outputs.flyer != 'false'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/flyer/requirements.txt

      # apt のフォント取得は 8 秒前後かかり、ミラーが遅い日はここで止まる。
      # 実際に読む .ttc 2 本だけをキャッシュし、ヒット時は system のパスへ戻す。
      - name: フォントのキャッシュを戻す
        id: fonts
        if: steps.scope.outputs.flyer != 'false'
        uses: actions/cache@v6
        with:
          path: .noto-fonts
          key: noto-cjk-regular-1

      - name: フォントを配る（キャッシュにヒットしたとき）
        if: steps.scope.outputs.flyer != 'false' && steps.fonts.outputs.cache-hit == 'true'
        working-directory: .
        run: |
          sudo mkdir -p /usr/share/fonts/opentype/noto
          sudo cp .noto-fonts/*.ttc /usr/share/fonts/opentype/noto/
          sudo fc-cache -f > /dev/null
          fc-match "Noto Sans CJK JP"

      - name: 日本語フォントを入れる（キャッシュが無いとき）
        if: steps.scope.outputs.flyer != 'false' && steps.fonts.outputs.cache-hit != 'true'
        run: |
          # runner には apt のインデックスが用意済みなので、まず install だけを試す。
          # apt-get update はミラーが遅い日に数分〜十数分待たされることがある。
          if ! sudo apt-get install -y --no-install-recommends fonts-noto-cjk; then
            echo "インデックスが古いので update してから入れ直す"
            sudo timeout 180 apt-get update
            sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fi
          fc-match "Noto Sans CJK JP"

      # FontResolver が実際に開くのは NotoSansCJK-Regular.ttc と NotoSerifCJK-Regular.ttc。
      - name: 次回のためにフォントを控える
        if: steps.scope.outputs.flyer != 'false' && steps.fonts.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          mkdir -p .noto-fonts
          cp /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc .noto-fonts/
          cp /usr/share/fonts/opentype/noto/NotoSerifCJK-Regular.ttc .noto-fonts/

      # pip install は 14 秒前後かかる。展開済みの venv を戻し、揃っていれば
      # pip の依存解決だけを数秒で通す。
      - name: venv を戻す
        id: venv
        if: steps.scope.outputs.flyer != 'false'
        uses: actions/cache@v6
        with:
          path: services/flyer/.venv
          key: ${{ runner.os }}-flyer-venv-${{ hashFiles('services/flyer/requirements.txt') }}

      - name: 壊れた venv を捨てる
        if: steps.scope.outputs.flyer != 'false' && steps.venv.outputs.cache-hit == 'true'
        run: .venv/bin/python -c "import pytest, mypy" || rm -rf .venv

      - name: venv を用意する
        if: steps.scope.outputs.flyer != 'false'
        run: test -x .venv/bin/python || python -m venv .venv

      - name: 依存を入れる
        if: steps.scope.outputs.flyer != 'false'
        run: .venv/bin/python -m pip install --quiet -r requirements.txt

      - name: pytest（振る舞い）
        if: steps.scope.outputs.flyer != 'false'
        run: .venv/bin/python -m pytest -q

      # services/flyer/mypy.ini の strict 設定で src だけを見る。
      - name: mypy（型）
        if: steps.scope.outputs.flyer != 'false'
        run: .venv/bin/python -m mypy
