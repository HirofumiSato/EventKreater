# staging のメール中継。アプリは MAIL_WEBHOOK_URL に { to, subject, body } を
# 認証ヘッダなしで POST するだけ。
name = "event-creater-mail-stg"
main = "src/index.mjs"
compatibility_date = "2026-11-01"

# Resend の送信ドメイン（send-stg.eventkreater.com）とは別のホストにする。
# 同じ名前にすると custom domain と DKIM の DNS が衝突する。
routes = [{ pattern = "mail-hook-stg.eventkreater.com", custom_domain = true }]

# Cloudflare Access は付けない。Access はブラウザのログインを要求し、
# アプリは認証ヘッダを付けられないので Worker まで届かなくなる。
# 代わりに URL のパスへ WEBHOOK_TOKEN を埋め、一致しない要求は 404 で捨てる。
#
# 秘密は wrangler secret put で入れる（RESEND_API_KEY / WEBHOOK_TOKEN /
# MAIL_FROM / ALLOWED_RECIPIENTS）。手元の .dev.vars は .gitignore 済みで、
# コミットしない。
