# event-creater-sms（本番）の Cloudflare Worker 構成。
#
# 既定は本番、派生は別ファイル。`fly.toml` / `fly.stg.toml` と同じ方針で、
# staging は wrangler.toml（event-creater-sms-stg）に置く。
# staging との違いはアプリ名とホスト名だけ。
name = "event-creater-sms"
main = "src/index.mjs"
compatibility_date = "2026-11-01"

# メール中継（mail-hook.eventkreater.com）とは別のホストにする。
# 同じ名前にすると custom domain の DNS が衝突する。
routes = [{ pattern = "sms-hook.eventkreater.com", custom_domain = true }]

# Cloudflare Access は付けない。Access はブラウザのログインを要求し、
# アプリは認証ヘッダを付けられないので Worker まで届かなくなる。
# 代わりに URL のパスへ WEBHOOK_TOKEN を埋め、一致しない要求は 404 で捨てる。
#
# 秘密は wrangler secret put で入れる（TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN /
# SMS_FROM / WEBHOOK_TOKEN / ALLOWED_RECIPIENTS）。本番で参加者・主催者へ
# 直接送る場合は ALLOWED_RECIPIENTS に `*` を入れる（未設定・空なら従来どおり全拒否）。
# 手元の .dev.vars は .gitignore 済みで、コミットしない。
#
# 配備は `wrangler deploy --config wrangler.prod.toml`。
